name: Unpack Trees

on:
  push:
    branches:
      - main
    paths:
      - "r2-upload-all.zip"

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ZIP archive
        run: |
          set -euo pipefail

          ZIP_FILE="r2-upload-all.zip"
          MAX_SIZE_MB=2048

          [ -f "$ZIP_FILE" ] || {
            echo "ZIP file not found: $ZIP_FILE"
            exit 1
          }

          SIZE_BYTES=$(stat -c%s "$ZIP_FILE")
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))

          if [ "$SIZE_MB" -gt "$MAX_SIZE_MB" ]; then
            echo "ZIP exceeds ${MAX_SIZE_MB}MB limit."
            exit 1
          fi

          echo "Testing ZIP integrity..."
          unzip -tq "$ZIP_FILE"

          echo "Listing ZIP contents..."
          unzip -Z -1 "$ZIP_FILE" > zip-contents.txt

          if [ ! -s zip-contents.txt ]; then
            echo "ZIP archive is empty."
            exit 1
          fi

          echo "Checking for path traversal..."
          if grep -E '(^/|(^|/)\.\.(/|$))' zip-contents.txt; then
            echo "Unsafe path detected."
            exit 1
          fi

          echo "Checking for Windows drive paths..."
          if grep -Ei '^[a-z]:' zip-contents.txt; then
            echo "Windows absolute path detected."
            exit 1
          fi

          echo "Checking for symlinks..."

          while IFS= read -r entry; do
            details=$(zipinfo -l "$ZIP_FILE" "$entry" 2>/dev/null || true)

            if echo "$details" | grep -q '^l'; then
              echo "Symlink detected and rejected: $entry"
              exit 1
            fi
          done < zip-contents.txt

          echo "ZIP validation passed."

      - name: Prepare sample directory
        run: |
          mkdir -p sample

      - name: Extract ZIP into sample
        run: |
          set -euo pipefail

          TMP_DIR=$(mktemp -d)

          unzip -q r2-upload-all.zip -d "$TMP_DIR"

          SRC="$TMP_DIR"

          CHILD_COUNT=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$CHILD_COUNT" -eq 1 ]; then
            ONLY_ITEM=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1)

            if [ -d "$ONLY_ITEM" ]; then
              SRC="$ONLY_ITEM"
            fi
          fi

          rsync -a --delete \
            --exclude=".git" \
            --exclude=".github" \
            "$SRC"/ ./sample/

          rm -f r2-upload-all.zip

      - name: Commit extracted files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Unpack r2-upload-all.zip into sample [skip ci]"
          git push
